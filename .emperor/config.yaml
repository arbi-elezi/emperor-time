# Emperor Time adjustable rigor — schema v1
# Thin extension of effort_class (no parallel ladder).
# Aliases: standard→small, full→large. Missing file → defaults (tiny).
# Iron gates (always_hard) NEVER soft: forge-pr-consent, pin-and-consent,
# quarantine, steal-consent, secrets-no-leak (+ enlist/credentials via those).
# Feature knobs: archaeology_depth off|shallow|full; sandbox; sot; wip.max; critique.
version: 1
rigor:
  default_effort_class: tiny
  aliases:
    standard: small
    full: large
  auto_detect_little: true
gates:
  always_hard:
    - forge-pr-consent
    - pin-and-consent
    - quarantine
    - steal-consent
    - secrets-no-leak
  scale_with_effort: true
harness:
  force_table_source: builtin
  require_plan: true
  require_spec: true
features:
  archaeology_depth: off
  sandbox: false
  sot: false
wip:
  max: 1
critique:
  scale_with_effort: true
  require_eight_count_at: medium

# Optional judgment adapter (PR3) — off by default; never required for core factory.
# Env: EMPEROR_JUDGMENT_API_KEY + EMPEROR_JUDGMENT_BASE_URL (openai_compat/openrouter).
# NEVER call on tiny happy-path; soft None → existing gates decide.
judgment:
  provider: off   # off | openrouter | openai_compat
  model: null     # JEV: no concrete model slug shipped
  timeout_s: 8
  use_for:
    - effort_class_dispute
    - ship_no_ship
    - critique_conflict
